<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndPlayZone | Exclusive Platform</title>
    <!-- FontAwesome for Professional Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Web Font: Pretendard -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    
    <style>
        /* ==========================================
           1. CSS 변수 및 기본 초기화 (Design System)
           ========================================== */
        :root {
            --bg-base: #09090b;
            --panel-bg: rgba(24, 24, 27, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --secondary: #a855f7;
            --accent: #06b6d4;
            --dev-color: #f59e0b;
            --dev-glow: rgba(245, 158, 11, 0.4);
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --font-family: 'Pretendard', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }
        
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* ==========================================
           2. 레이아웃 & 스크린 트랜지션
           ========================================== */
        .screen {
            display: none; width: 100%; height: 100%;
            opacity: 0; transform: scale(0.98) translateY(10px);
            transition: var(--transition);
            align-items: center; justify-content: center;
        }
        .screen.active {
            display: flex; opacity: 1; transform: scale(1) translateY(0);
        }

        /* ==========================================
           3. UI 컴포넌트 (Glassmorphism & Inputs)
           ========================================== */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-box { padding: 3rem; width: 100%; max-width: 420px; text-align: center; }
        .auth-box h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -1px; }
        .auth-box p { color: var(--text-muted); margin-bottom: 2.5rem; }

        .input-group { position: relative; margin-bottom: 1.5rem; }
        .input-group i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-group input {
            width: 100%; padding: 1.2rem 1.2rem 1.2rem 3rem;
            background: rgba(0, 0, 0, 0.2); border: 1px solid var(--panel-border);
            border-radius: 14px; color: var(--text-main); font-size: 1rem; outline: none;
            transition: var(--transition);
        }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .btn {
            width: 100%; padding: 1.2rem; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 14px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: var(--transition); position: relative; overflow: hidden;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px var(--primary-glow); }

        /* ==========================================
           4. 메인 대시보드 레이아웃
           ========================================== */
        #screen-dashboard { padding: 2rem; align-items: stretch; gap: 1.5rem; max-width: 1600px; margin: 0 auto; height: 100vh; }
        
        .dash-col { display: flex; flex-direction: column; gap: 1.5rem; height: 100%; }
        .col-left { flex: 1; min-width: 280px; }
        .col-center { flex: 2; min-width: 450px; }
        .col-right { flex: 1.2; min-width: 320px; }

        .section-header { font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid var(--panel-border); padding-bottom: 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        
        /* User List */
        .user-list { list-style: none; overflow-y: auto; max-height: calc(50vh - 100px); margin-bottom: 1rem; padding-right: 5px;}
        .user-item {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            background: rgba(255,255,255,0.02); border-radius: 12px; margin-bottom: 8px;
            border: 1px solid transparent; transition: var(--transition);
        }
        .user-item:hover { background: rgba(255,255,255,0.05); border-color: var(--panel-border); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .is-online { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .is-offline { background: var(--text-muted); }
        .user-name { flex-grow: 1; font-weight: 500; }
        .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
        .badge.dev { background: rgba(245, 158, 11, 0.2); color: var(--dev-color); border: 1px solid var(--dev-color); }

        /* Notices */
        .notice-container { overflow-y: auto; height: calc(100vh - 120px); padding-right: 10px; }
        .notice-card {
            background: linear-gradient(90deg, rgba(99,102,241,0.05) 0%, transparent 100%);
            border-left: 4px solid var(--primary); padding: 1.5rem; border-radius: 0 16px 16px 0;
            margin-bottom: 1rem; position: relative;
        }
        .notice-card.event { border-left-color: var(--dev-color); background: linear-gradient(90deg, rgba(245,158,11,0.05) 0%, transparent 100%); }
        .notice-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
        .notice-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .notice-content { line-height: 1.6; color: rgba(255,255,255,0.8); }

        /* Profile */
        .profile-wrap { text-align: center; padding: 2rem 1rem; }
        .avatar {
            width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: 800; box-shadow: 0 10px 25px var(--primary-glow);
        }
        .profile-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.3rem; }
        .profile-role { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .score-box { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 1.5rem; border: 1px solid var(--panel-border); }
        .score-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .score-value { font-size: 2.5rem; font-weight: 800; color: var(--dev-color); letter-spacing: -1px; }

        /* Developer Tools */
        .dev-tools-wrap { display: none; padding: 1.5rem; margin-top: 1rem; border: 1px solid var(--dev-color); background: rgba(24, 24, 27, 0.8); }
        .dev-tools-wrap.active { display: block; animation: slideUp 0.5s ease; }
        .dev-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 1rem; }
        .dev-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border);
            color: var(--text-main); padding: 1rem; border-radius: 12px;
            font-size: 0.9rem; font-weight: 600; display: flex; flex-direction: column;
            align-items: center; gap: 8px; cursor: pointer; transition: var(--transition);
        }
        .dev-btn i { font-size: 1.2rem; color: var(--dev-color); }
        .dev-btn:hover { background: rgba(245, 158, 11, 0.1); border-color: var(--dev-color); transform: translateY(-3px); }

        /* ==========================================
           5. 모달 및 토스트 시스템 (고퀄리티 UI)
           ========================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: var(--transition); z-index: 999;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { width: 100%; max-width: 400px; padding: 2rem; transform: scale(0.9); transition: var(--transition); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-header { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .modal-body select, .modal-body input, .modal-body textarea {
            width: 100%; padding: 1rem; background: rgba(0,0,0,0.3); border: 1px solid var(--panel-border);
            color: white; border-radius: 10px; margin-bottom: 1rem; font-size: 1rem; outline: none;
        }
        .modal-body textarea { resize: none; height: 100px; }
        .modal-footer { display: flex; gap: 10px; }
        .modal-footer button { flex: 1; padding: 1rem; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
        .btn-confirm { background: var(--dev-color); color: black; }
        .btn-confirm:hover { background: #d97706; }

        /* Toast */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--panel-border);
            padding: 1rem 1.5rem; border-radius: 12px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); animation: slideInRight 0.4s ease forwards;
        }
        .toast i { font-size: 1.2rem; }
        .toast.success i { color: var(--success); }
        .toast.warning i { color: var(--dev-color); }
        .toast.error i { color: var(--danger); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(50px); } }

    </style>
</head>
<body>

    <!-- ==========================================
         [화면 1] 접속 비밀번호 시스템
         ========================================== -->
    <main id="screen-password" class="screen active">
        <div class="glass-panel auth-box">
            <h1><i class="fa-solid fa-gamepad" style="color: var(--primary);"></i> AndPlayZone</h1>
            <p>프라이빗 플랫폼에 접근하기 위해<br>사이트 비밀번호를 입력해주세요.</p>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="sys-pw" placeholder="비밀번호 입력..." autocomplete="off">
            </div>
            <button class="btn" onclick="app.verifyPassword()">시스템 접속</button>
        </div>
    </main>

    <!-- ==========================================
         [화면 2] 계정 생성 / 로그인 (DB 연동)
         ========================================== -->
    <main id="screen-login" class="screen">
        <div class="glass-panel auth-box">
            <h1><i class="fa-solid fa-user-plus" style="color: var(--secondary);"></i> 신규/기존 접속</h1>
            <p>이름을 입력하여 입장하세요.<br><small>(가입된 이름이면 기존 데이터로 로드됩니다.)</small></p>
            <div class="input-group">
                <i class="fa-solid fa-id-badge"></i>
                <input type="text" id="user-name" placeholder="사용할 닉네임 입력..." autocomplete="off">
            </div>
            <button class="btn" onclick="app.loginOrSignup()">입장하기</button>
        </div>
    </main>

    <!-- ==========================================
         [화면 3] 메인 대시보드 (로비)
         ========================================== -->
    <main id="screen-dashboard" class="screen">
        
        <!-- 왼쪽 패널: 접속자 목록 -->
        <div class="glass-panel dash-col col-left" style="padding: 1.5rem;">
            <h2 class="section-header"><i class="fa-solid fa-users"></i> 접속자 현황</h2>
            
            <h3 style="font-size:0.9rem; color:var(--success); margin: 10px 0;">온라인 참여자</h3>
            <ul class="user-list" id="list-online"></ul>

            <h3 style="font-size:0.9rem; color:var(--text-muted); margin: 10px 0; margin-top: 1.5rem;">오프라인 참여자</h3>
            <ul class="user-list" id="list-offline"></ul>
        </div>

        <!-- 중앙 패널: 공지사항 및 이벤트 -->
        <div class="glass-panel dash-col col-center" style="padding: 1.5rem; background: rgba(24, 24, 27, 0.4);">
            <h2 class="section-header"><i class="fa-solid fa-bullhorn"></i> 시스템 & 이벤트 공지</h2>
            <div class="notice-container" id="notice-board">
                <!-- JS에서 렌더링 -->
            </div>
        </div>

        <!-- 오른쪽 패널: 내 정보 & 개발자 전용 -->
        <div class="dash-col col-right">
            <!-- 프로필 카드 -->
            <div class="glass-panel profile-wrap">
                <div class="avatar" id="my-avatar">U</div>
                <div class="profile-name" id="my-name">User Name</div>
                <div class="profile-role" id="my-role">일반 참여자</div>
                <div class="score-box">
                    <div class="score-title">보유 시스템 점수</div>
                    <div class="score-value" id="my-score">0</div>
                </div>
                <button class="btn" style="margin-top: 1rem; background: rgba(255,255,255,0.1); font-size: 0.9rem; padding: 0.8rem;" onclick="app.logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> 접속 종료 (로그아웃)
                </button>
            </div>

            <!-- 개발자 툴 (권한 있을때만 보임) -->
            <div class="glass-panel dev-tools-wrap" id="dev-panel">
                <h2 class="section-header" style="color: var(--dev-color); border-color: rgba(245,158,11,0.2);">
                    <i class="fa-solid fa-terminal"></i> 최고 관리자 시스템
                </h2>
                <!-- 최소 10개의 개발자 기능 구현 -->
                <div class="dev-grid">
                    <button class="dev-btn" onclick="modalManager.open('scoreModal')"><i class="fa-solid fa-star"></i> 점수 부여</button>
                    <button class="dev-btn" onclick="modalManager.open('subDevModal')"><i class="fa-solid fa-user-shield"></i> 권한 승격</button>
                    <button class="dev-btn" onclick="modalManager.open('eventModal')"><i class="fa-solid fa-calendar-check"></i> 이벤트 개최</button>
                    <button class="dev-btn" onclick="modalManager.open('noticeModal')"><i class="fa-solid fa-pen-to-square"></i> 전체 공지</button>
                    <button class="dev-btn" onclick="modalManager.open('kickModal')"><i class="fa-solid fa-user-slash"></i> 유저 추방</button>
                    <button class="dev-btn" onclick="app.devTools.resetScores()"><i class="fa-solid fa-rotate-left"></i> 점수 초기화</button>
                    <button class="dev-btn" onclick="app.devTools.freezeChat()"><i class="fa-solid fa-snowflake"></i> 채팅 얼리기</button>
                    <button class="dev-btn" onclick="modalManager.open('pwModal')"><i class="fa-solid fa-key"></i> 사이트 암호변경</button>
                    <button class="dev-btn" onclick="app.devTools.systemAlert()"><i class="fa-solid fa-bell"></i> 강제 시스템 알림</button>
                    <button class="dev-btn" onclick="app.devTools.maintenanceMode()"><i class="fa-solid fa-tools"></i> 점검 모드</button>
                    <button class="dev-btn" onclick="app.devTools.backupDB()"><i class="fa-solid fa-database"></i> DB 백업(다운)</button>
                    <button class="dev-btn" onclick="document.getElementById('import-file').click()"><i class="fa-solid fa-upload"></i> DB 복원</button>
                    <input type="file" id="import-file" style="display:none" accept=".json" onchange="app.devTools.restoreDB(event)">
                </div>
            </div>
        </div>
    </main>

    <!-- ==========================================
         [토스트 & 모달 UI 컨테이너]
         ========================================== -->
    <div id="toast-container"></div>

    <!-- 범용 모달 템플릿 영역 -->
    <div class="modal-overlay" id="global-modal">
        <div class="glass-panel modal-box">
            <div class="modal-header" id="modal-title"><i class="fa-solid fa-gear"></i> 설정</div>
            <div class="modal-body" id="modal-content">
                <!-- 동적 폼 삽입 -->
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="modalManager.close()">취소</button>
                <button class="btn-confirm" id="modal-confirm">확인</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         JavaScript 로직 (로컬 DB + UI 제어)
         ========================================== -->
    <script>
        /**
         * 1. GitHub Pages 용 로컬 데이터베이스 관리 (localStorage 기반)
         * - 백엔드가 없는 정적 웹호스팅 특성상 브라우저 스토리지를 DB로 활용합니다.
         */
        class LocalDB {
            constructor() {
                this.dbName = 'andplayzone_system_db';
                this.initDB();
            }

            initDB() {
                if (!localStorage.getItem(this.dbName)) {
                    const initialData = {
                        sitePassword: 'robuxlike', // 기본 접속 비밀번호
                        users: [], // { name, role, score, lastLogin }
                        notices: [
                            { type: 'info', title: 'AndPlayZone 시스템 구축 완료', content: '환영합니다. 본 시스템은 로컬 스토리지를 활용하여 데이터를 저장합니다.', date: this.getNow() }
                        ]
                    };
                    this.save(initialData);
                }
            }

            getData() { return JSON.parse(localStorage.getItem(this.dbName)); }
            save(data) { localStorage.setItem(this.dbName, JSON.stringify(data)); }
            getNow() { 
                const d = new Date(); 
                return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; 
            }
        }

        const db = new LocalDB();

        /**
         * 2. UI 및 모달 제어 시스템
         */
        const ui = {
            showScreen: (id) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                setTimeout(() => document.getElementById(id).classList.add('active'), 50);
            },
            toast: (msg, type = 'success') => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                let icon = type === 'success' ? 'check-circle' : type === 'warning' ? 'triangle-exclamation' : 'circle-xmark';
                toast.innerHTML = `<i class="fa-solid fa-${icon}"></i> <span>${msg}</span>`;
                container.appendChild(toast);
                setTimeout(() => { toast.style.animation = 'fadeOut 0.4s ease forwards'; setTimeout(() => toast.remove(), 400); }, 3000);
            },
            renderSelectOptions: (excludeSelf = false) => {
                const data = db.getData();
                let html = `<option value="">대상을 선택하세요...</option>`;
                data.users.forEach(u => {
                    if(excludeSelf && u.name === app.currentUser.name) return;
                    html += `<option value="${u.name}">${u.name} (현재 ${u.score}점)</option>`;
                });
                return html;
            }
        };

        const modalManager = {
            open: (actionType) => {
                const overlay = document.getElementById('global-modal');
                const title = document.getElementById('modal-title');
                const content = document.getElementById('modal-content');
                const confirmBtn = document.getElementById('modal-confirm');
                
                content.innerHTML = ''; // 초기화

                switch(actionType) {
                    case 'scoreModal':
                        title.innerHTML = '<i class="fa-solid fa-star"></i> 시스템 점수 부여';
                        content.innerHTML = `
                            <select id="m-target">${ui.renderSelectOptions()}</select>
                            <input type="number" id="m-amount" placeholder="지급할 점수 입력..." />
                        `;
                        confirmBtn.onclick = () => app.devTools.giveScore(document.getElementById('m-target').value, parseInt(document.getElementById('m-amount').value));
                        break;
                    case 'subDevModal':
                        title.innerHTML = '<i class="fa-solid fa-user-shield"></i> 관리자 권한 승격';
                        content.innerHTML = `<select id="m-target">${ui.renderSelectOptions(true)}</select><p style="font-size:0.8rem; color:var(--text-muted); margin-top:10px;">선택한 유저에게 개발자 패널 접근 권한을 줍니다.</p>`;
                        confirmBtn.onclick = () => app.devTools.promoteDev(document.getElementById('m-target').value);
                        break;
                    case 'eventModal':
                        title.innerHTML = '<i class="fa-solid fa-calendar-check"></i> 신규 이벤트 개최';
                        content.innerHTML = `
                            <input type="text" id="m-title" placeholder="이벤트 타이틀..." />
                            <textarea id="m-desc" placeholder="이벤트 상세 내용 입력..."></textarea>
                        `;
                        confirmBtn.onclick = () => app.devTools.addNotice('event', document.getElementById('m-title').value, document.getElementById('m-desc').value);
                        break;
                    case 'noticeModal':
                        title.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> 전체 시스템 공지';
                        content.innerHTML = `
                            <input type="text" id="m-title" placeholder="공지 제목..." />
                            <textarea id="m-desc" placeholder="공지 내용 입력..."></textarea>
                        `;
                        confirmBtn.onclick = () => app.devTools.addNotice('info', document.getElementById('m-title').value, document.getElementById('m-desc').value);
                        break;
                    case 'kickModal':
                        title.innerHTML = '<i class="fa-solid fa-user-slash"></i> 유저 영구 추방';
                        content.innerHTML = `<select id="m-target">${ui.renderSelectOptions(true)}</select>`;
                        confirmBtn.onclick = () => app.devTools.kickUser(document.getElementById('m-target').value);
                        break;
                    case 'pwModal':
                        title.innerHTML = '<i class="fa-solid fa-key"></i> 사이트 암호 변경';
                        content.innerHTML = `<input type="text" id="m-pw" placeholder="새로운 접속 암호 입력..." />`;
                        confirmBtn.onclick = () => app.devTools.changePassword(document.getElementById('m-pw').value);
                        break;
                }
                overlay.classList.add('active');
            },
            close: () => { document.getElementById('global-modal').classList.remove('active'); }
        };

        /**
         * 3. 메인 어플리케이션 비즈니스 로직
         */
        const app = {
            currentUser: null,

            // 1) 비밀번호 검증
            verifyPassword: () => {
                const input = document.getElementById('sys-pw').value;
                const data = db.getData();
                if (input === data.sitePassword) {
                    ui.toast('시스템 접근 허가됨');
                    ui.showScreen('screen-login');
                } else {
                    ui.toast('비밀번호가 일치하지 않습니다.', 'error');
                }
            },

            // 2) 로그인 및 이스터에그 회원가입
            loginOrSignup: () => {
                let name = document.getElementById('user-name').value.trim();
                if (!name) return ui.toast('이름을 입력해주세요.', 'warning');

                let data = db.getData();
                
                // 이스터에그 발동: endvipiscreat 입력 시 개발자 자동 세팅
                if (name === 'endvipiscreat') {
                    name = '앤드맨 개발자';
                    let devExists = data.users.find(u => u.name === name);
                    if (!devExists) {
                        data.users.push({ name: name, role: 'dev', score: 99999, lastLogin: db.getNow() });
                        db.save(data);
                    }
                }

                // 기존 유저 찾기 or 신규 생성
                let user = data.users.find(u => u.name === name);
                if (user) {
                    user.lastLogin = db.getNow(); // 갱신
                    db.save(data);
                    ui.toast(`${user.name}님 다시 오신 것을 환영합니다.`);
                } else {
                    user = { name: name, role: 'user', score: 0, lastLogin: db.getNow() };
                    data.users.push(user);
                    db.save(data);
                    ui.toast(`신규가입 완료! 환영합니다, ${name}님.`);
                }

                app.currentUser = user;
                app.initDashboard();
            },

            // 로그아웃
            logout: () => {
                app.currentUser = null;
                document.getElementById('user-name').value = '';
                ui.toast('안전하게 로그아웃 되었습니다.');
                ui.showScreen('screen-login');
            },

            // 3) 대시보드 렌더링
            initDashboard: () => {
                ui.showScreen('screen-dashboard');
                app.renderProfile();
                app.renderUsers();
                app.renderNotices();
            },

            renderProfile: () => {
                const u = app.currentUser;
                document.getElementById('my-avatar').innerText = u.name.charAt(0);
                document.getElementById('my-name').innerText = u.name;
                document.getElementById('my-role').innerText = u.role === 'dev' ? '👑 최고 관리자' : '일반 참여자';
                document.getElementById('my-score').innerText = u.score.toLocaleString();
                
                const devPanel = document.getElementById('dev-panel');
                if (u.role === 'dev') devPanel.classList.add('active');
                else devPanel.classList.remove('active');
            },

            renderUsers: () => {
                const data = db.getData();
                const onList = document.getElementById('list-online');
                const offList = document.getElementById('list-offline');
                onList.innerHTML = ''; offList.innerHTML = '';

                // 현재 로그인한 유저를 맨 위에, 나머지는 임의로 오프라인/온라인 분리 (로컬DB 한계 극복 시뮬레이션)
                data.users.forEach(u => {
                    const isMe = u.name === app.currentUser.name;
                    // 실제 웹소켓이 없으므로 현재 접속자만 온라인으로 표시, 나머진 오프라인 처리
                    const statusClass = isMe ? 'is-online' : 'is-offline';
                    const badge = u.role === 'dev' ? `<span class="badge dev">DEV</span>` : '';
                    
                    const li = `
                        <li class="user-item">
                            <div class="status-dot ${statusClass}"></div>
                            <div class="user-name">${u.name} ${isMe ? '(나)' : ''}</div>
                            ${badge}
                        </li>
                    `;
                    if (isMe) onList.innerHTML += li;
                    else offList.innerHTML += li;
                });
            },

            renderNotices: () => {
                const data = db.getData();
                const board = document.getElementById('notice-board');
                board.innerHTML = '';
                
                // 최신순으로 렌더링
                [...data.notices].reverse().forEach(n => {
                    const icon = n.type === 'event' ? '<i class="fa-solid fa-gift" style="color:var(--dev-color)"></i>' : '<i class="fa-solid fa-circle-info" style="color:var(--primary)"></i>';
                    const typeClass = n.type === 'event' ? 'event' : '';
                    board.innerHTML += `
                        <div class="notice-card ${typeClass}">
                            <div class="notice-header"><span>${icon} ${n.type.toUpperCase()}</span><span>${n.date}</span></div>
                            <div class="notice-title">${n.title}</div>
                            <div class="notice-content">${n.content.replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                });
            },

            /**
             * 4. 개발자 전용 도구 모음 (10개 이상 기능)
             */
            devTools: {
                // 1. 점수 주기
                giveScore: (targetName, amount) => {
                    if(!targetName || !amount) return ui.toast('입력값이 올바르지 않습니다.', 'error');
                    let data = db.getData();
                    let target = data.users.find(u => u.name === targetName);
                    if(target) {
                        target.score += amount;
                        db.save(data);
                        ui.toast(`[시스템] ${targetName}님에게 ${amount}점 지급 완료.`);
                        if(targetName === app.currentUser.name) app.currentUser.score += amount; // 내 점수면 실시간 반영
                        app.initDashboard();
                        modalManager.close();
                    }
                },
                // 2. 부개발자 승격
                promoteDev: (targetName) => {
                    if(!targetName) return ui.toast('대상을 선택하세요.', 'error');
                    let data = db.getData();
                    let target = data.users.find(u => u.name === targetName);
                    if(target) {
                        target.role = 'dev';
                        db.save(data);
                        ui.toast(`${targetName}님을 개발자로 승격했습니다.`);
                        app.initDashboard();
                        modalManager.close();
                    }
                },
                // 3 & 4. 이벤트 및 공지 작성
                addNotice: (type, title, content) => {
                    if(!title || !content) return ui.toast('모든 칸을 입력하세요.', 'error');
                    let data = db.getData();
                    data.notices.push({ type, title, content, date: db.getNow() });
                    db.save(data);
                    ui.toast(type === 'event' ? '이벤트가 성공적으로 개최되었습니다!' : '공지사항이 등록되었습니다.');
                    app.initDashboard();
                    modalManager.close();
                },
                // 5. 유저 추방 (DB에서 삭제)
                kickUser: (targetName) => {
                    if(!targetName) return;
                    let data = db.getData();
                    data.users = data.users.filter(u => u.name !== targetName);
                    db.save(data);
                    ui.toast(`${targetName}님을 시스템에서 영구 추방했습니다.`, 'warning');
                    app.initDashboard();
                    modalManager.close();
                },
                // 6. 점수 초기화
                resetScores: () => {
                    if(!confirm('정말 모든 유저의 점수를 0으로 초기화하시겠습니까?')) return;
                    let data = db.getData();
                    data.users.forEach(u => u.score = 0);
                    db.save(data);
                    app.currentUser.score = 0;
                    ui.toast('모든 유저의 점수가 초기화 되었습니다.', 'warning');
                    app.initDashboard();
                },
                // 7. 채팅/로비 얼리기 (시뮬레이션)
                freezeChat: () => {
                    ui.toast('서버 전체 채팅 및 상호작용이 동결되었습니다. (얼리기 ON)', 'warning');
                },
                // 8. 사이트 비밀번호 변경
                changePassword: (newPw) => {
                    if(!newPw) return ui.toast('비밀번호를 입력하세요.', 'error');
                    let data = db.getData();
                    data.sitePassword = newPw;
                    db.save(data);
                    ui.toast(`사이트 접속 암호가 '${newPw}' 로 변경되었습니다.`);
                    modalManager.close();
                },
                // 9. 강제 시스템 알림
                systemAlert: () => {
                    ui.toast('⚠️ [최고관리자] 강제 시스템 알림이 전체 발송되었습니다.', 'warning');
                },
                // 10. 점검 모드 (강제 로그아웃)
                maintenanceMode: () => {
                    if(!confirm('점검 모드를 켜면 모든 사용자가 튕기며 로그인 화면으로 갑니다. 진행하시겠습니까?')) return;
                    ui.toast('🚧 서버 점검 모드 가동. 연결을 종료합니다...', 'error');
                    setTimeout(() => { app.logout(); ui.showScreen('screen-password'); }, 1500);
                },
                // 11. DB 백업 (JSON 파일 다운로드 - GitHub Pages 환경 필수)
                backupDB: () => {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db.getData(), null, 2));
                    const dlAnchorElem = document.createElement('a');
                    dlAnchorElem.setAttribute("href", dataStr);
                    dlAnchorElem.setAttribute("download", `AndPlayZone_DB_Backup_${Date.now()}.json`);
                    dlAnchorElem.click();
                    ui.toast('데이터베이스 백업 파일이 다운로드 되었습니다.');
                },
                // 12. DB 복원 (JSON 파일 업로드)
                restoreDB: (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const importedData = JSON.parse(e.target.result);
                            if(importedData.users && importedData.notices) {
                                db.save(importedData);
                                ui.toast('DB 복원 성공! 시스템을 재시작합니다.');
                                setTimeout(() => location.reload(), 1500);
                            } else {
                                ui.toast('올바르지 않은 백업 파일입니다.', 'error');
                            }
                        } catch(err) {
                            ui.toast('파일 파싱 에러', 'error');
                        }
                    };
                    reader.readAsText(file);
                }
            }
        };

        // 엔터키 이벤트 바인딩
        document.getElementById('sys-pw').addEventListener('keypress', (e) => { if(e.key === 'Enter') app.verifyPassword(); });
        document.getElementById('user-name').addEventListener('keypress', (e) => { if(e.key === 'Enter') app.loginOrSignup(); });

    </script>
</body>
</html>
