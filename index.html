<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndPlayZone | Ultimate Edition</title>
    <!-- FontAwesome Pro Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Web Font: Pretendard -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    
    <style>
        /* =========================================================
           [1] DESIGN SYSTEM & THEME VARIABLES
           ========================================================= */
        :root {
            --bg-dark: #0f111a;
            --bg-panel: rgba(22, 25, 43, 0.75);
            --bg-panel-hover: rgba(30, 34, 56, 0.9);
            --border-light: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.6);
            --secondary: #ec4899;
            --dev-color: #f59e0b;
            --dev-glow: rgba(245, 158, 11, 0.5);
            --success: #10b981;
            --danger: #ef4444;
            --info: #0ea5e9;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dark: #1e293b;

            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;

            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --glass-filter: blur(16px);
        }

        /* =========================================================
           [2] RESET & BASE STYLES
           ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.1), transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* =========================================================
           [3] UTILITY CLASSES & GLASSMORPHISM
           ========================================================= */
        .glass {
            background: var(--bg-panel);
            backdrop-filter: var(--glass-filter);
            -webkit-backdrop-filter: var(--glass-filter);
            border: 1px solid var(--border-light);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; opacity: 0; transform: scale(0.98);
            transition: var(--transition);
            z-index: 10; align-items: center; justify-content: center;
        }
        .screen.active { display: flex; opacity: 1; transform: scale(1); z-index: 20; }

        .btn {
            padding: 1rem 1.5rem; border: none; border-radius: var(--radius-md);
            font-size: 1rem; font-weight: 700; color: white; cursor: pointer;
            transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #4f46e5); box-shadow: 0 4px 15px var(--primary-glow); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--primary-glow); filter: brightness(1.1); }
        .btn-outline { background: transparent; border: 1px solid var(--border-light); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); border-color: var(--text-muted); }
        
        .input-group { position: relative; width: 100%; margin-bottom: 1.5rem; }
        .input-group i { position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-field {
            width: 100%; padding: 1.2rem 1.2rem 1.2rem 3rem; border-radius: var(--radius-md);
            background: rgba(0,0,0,0.4); border: 1px solid var(--border-light); color: white;
            font-size: 1rem; transition: var(--transition); outline: none;
        }
        .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }

        /* =========================================================
           [4] AUTH SCREENS (Login & Password)
           ========================================================= */
        .auth-box { width: 90%; max-width: 420px; padding: 3rem 2rem; border-radius: var(--radius-lg); text-align: center; }
        .auth-logo { font-size: 3rem; color: var(--primary); margin-bottom: 1rem; filter: drop-shadow(0 0 10px var(--primary-glow)); }
        .auth-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .auth-desc { color: var(--text-muted); margin-bottom: 2rem; line-height: 1.5; }

        /* =========================================================
           [5] MAIN DASHBOARD LAYOUT (Responsive)
           ========================================================= */
        #screen-main { padding: 1rem; align-items: stretch; gap: 1rem; display: none; height: 100vh; }
        #screen-main.active { display: flex; }

        .layout-panel { border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
        
        /* 헤더 (모바일용) */
        .mobile-header { display: none; justify-content: space-between; align-items: center; padding: 1rem; background: var(--bg-panel); border-radius: var(--radius-lg); margin-bottom: 1rem; }
        
        /* Left: Users */
        .panel-left { width: 280px; flex-shrink: 0; padding: 1.5rem; }
        /* Center: Chat & Board */
        .panel-center { flex: 1; min-width: 0; position: relative; }
        /* Right: Profile & Dev */
        .panel-right { width: 340px; flex-shrink: 0; padding: 1.5rem; overflow-y: auto; }

        /* Section Titles */
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 8px; }

        /* User List */
        .user-list { list-style: none; overflow-y: auto; flex: 1; margin-bottom: 1rem; }
        .user-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-sm); margin-bottom: 5px; transition: var(--transition); cursor: pointer; }
        .user-item:hover { background: rgba(255,255,255,0.05); }
        .avatar-sm { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; }
        .user-info { flex: 1; overflow: hidden; }
        .user-name-txt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }
        .user-score-txt { font-size: 0.75rem; color: var(--dev-color); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .offline { background: var(--text-muted); }

        /* =========================================================
           [6] CHAT & NOTICE SYSTEM
           ========================================================= */
        .chat-container { display: flex; flex-direction: column; height: 100%; background: rgba(0,0,0,0.2); }
        .chat-header { padding: 1rem 1.5rem; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border-light); font-weight: 700; display: flex; justify-content: space-between; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        
        .chat-msg { display: flex; gap: 10px; max-width: 85%; animation: slideInUp 0.3s ease; }
        .chat-msg.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-content { display: flex; flex-direction: column; gap: 4px; }
        .chat-msg.me .msg-content { align-items: flex-end; }
        .msg-sender { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 5px; align-items: center; }
        .msg-bubble { background: var(--bg-panel); padding: 0.8rem 1.2rem; border-radius: 0 16px 16px 16px; font-size: 0.95rem; line-height: 1.4; word-break: break-all; }
        .chat-msg.me .msg-bubble { background: var(--primary); border-radius: 16px 0 16px 16px; }
        
        /* Emoticon in chat */
        .msg-emoticon { max-width: 120px; border-radius: 8px; background: transparent; padding: 0; }
        
        /* System Notice in chat */
        .msg-sys { align-self: center; background: rgba(245, 158, 11, 0.1); border: 1px solid var(--dev-color); color: var(--dev-color); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.85rem; max-width: 90%; text-align: center; }

        /* Chat Input */
        .chat-input-area { padding: 1rem; background: rgba(255,255,255,0.02); border-top: 1px solid var(--border-light); display: flex; gap: 10px; align-items: center; position: relative; }
        .chat-input-area input { flex: 1; padding: 1rem 1.2rem; border-radius: 20px; border: 1px solid var(--border-light); background: rgba(0,0,0,0.4); color: white; outline: none; }
        .chat-input-area input:focus { border-color: var(--primary); }
        .btn-icon { width: 45px; height: 45px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 1.2rem; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: var(--primary); }

        /* Emoticon Picker */
        .emoticon-picker { position: absolute; bottom: 80px; left: 1rem; width: 280px; height: 250px; background: var(--bg-panel); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 1rem; display: none; flex-wrap: wrap; gap: 10px; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(20px); }
        .emoticon-picker.active { display: flex; }
        .emo-item { width: 60px; height: 60px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 2px solid transparent; background-size: cover; background-position: center; }
        .emo-item:hover { border-color: var(--primary); transform: scale(1.1); }
        .emo-empty { width: 100%; text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 2rem; }

        /* =========================================================
           [7] PROFILE & DEVELOPER TOOLS
           ========================================================= */
        .profile-card { display: flex; flex-direction: column; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-light); margin-bottom: 1.5rem; position: relative; }
        .avatar-lg { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--border-light); background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; overflow: hidden; position: relative; cursor: pointer; }
        .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-lg .overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); font-size: 1rem; }
        .avatar-lg:hover .overlay { opacity: 1; }
        .profile-name { font-size: 1.5rem; font-weight: 800; margin: 1rem 0 0.2rem 0; }
        .profile-role { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
        .score-display { width: 100%; background: rgba(0,0,0,0.3); padding: 1.2rem; border-radius: var(--radius-md); text-align: center; border: 1px solid rgba(245, 158, 11, 0.2); }
        .score-value { font-size: 2.5rem; font-weight: 900; color: var(--dev-color); text-shadow: 0 0 10px var(--dev-glow); }

        /* Developer Grid (15+ Tools) */
        .dev-panel { display: none; margin-top: 1rem; background: rgba(245, 158, 11, 0.03); border: 1px solid rgba(245, 158, 11, 0.2); border-radius: var(--radius-md); padding: 1rem; }
        .dev-panel.active { display: block; animation: fadeIn 0.5s; }
        .dev-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .dev-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border-light); padding: 0.8rem 0.5rem; border-radius: var(--radius-sm); color: var(--text-main); font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: var(--transition); text-align: center; }
        .dev-btn i { font-size: 1.2rem; color: var(--dev-color); margin-bottom: 3px; }
        .dev-btn:hover { background: rgba(245, 158, 11, 0.15); border-color: var(--dev-color); transform: translateY(-2px); }

        /* =========================================================
           [8] RESPONSIVE (MOBILE) DESIGN
           ========================================================= */
        @media (max-width: 900px) {
            #screen-main { flex-direction: column; padding: 0; gap: 0; }
            .mobile-header { display: flex; border-radius: 0; margin-bottom: 0; border-bottom: 1px solid var(--border-light); }
            
            /* Sidebar Drawers */
            .panel-left, .panel-right {
                position: fixed; top: 0; height: 100vh; z-index: 100;
                background: rgba(15, 17, 26, 0.95); backdrop-filter: blur(20px);
                transition: transform 0.3s ease;
            }
            .panel-left { left: 0; transform: translateX(-100%); width: 280px; border-right: 1px solid var(--border-light); }
            .panel-right { right: 0; transform: translateX(100%); width: 320px; border-left: 1px solid var(--border-light); }
            
            .panel-left.open { transform: translateX(0); }
            .panel-right.open { transform: translateX(0); }
            
            .panel-center { height: calc(100vh - 70px); border-radius: 0; border: none; }
            
            /* Overlay for closing panels */
            .mobile-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index: 90; display:none; }
            .mobile-overlay.active { display: block; }
        }

        /* =========================================================
           [9] MODALS & TOASTS
           ========================================================= */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: var(--transition); }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { width: 90%; max-width: 400px; padding: 2rem; transform: translateY(20px); transition: var(--transition); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; color: var(--dev-color); }
        
        .form-control { width: 100%; padding: 1rem; background: rgba(0,0,0,0.5); border: 1px solid var(--border-light); color: white; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 1rem; outline:none; }
        .form-control:focus { border-color: var(--dev-color); }
        textarea.form-control { height: 100px; resize: none; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 1rem; }
        .modal-actions button { flex: 1; padding: 1rem; border: none; border-radius: var(--radius-sm); font-weight: bold; cursor: pointer; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-confirm { background: var(--dev-color); color: black; }

        #toast-box { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: var(--bg-panel); border: 1px solid var(--border-light); padding: 12px 24px; border-radius: 30px; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); animation: slideUpToast 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; backdrop-filter: blur(10px); }
        .toast.success i { color: var(--success); }
        .toast.error i { color: var(--danger); }
        .toast.info i { color: var(--info); }

        @keyframes slideInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpToast { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOutToast { to { opacity: 0; transform: translateY(-20px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Hidden File Inputs */
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- =========================================================
         [SCREEN 1] PASSWORD GATEWAY
         ========================================================= -->
    <div id="screen-pw" class="screen active">
        <div class="glass auth-box">
            <i class="fa-solid fa-shield-halved auth-logo"></i>
            <h1 class="auth-title">AndPlayZone</h1>
            <p class="auth-desc">프라이빗 서버에 접근하기 위해<br>시스템 접속 암호를 입력하십시오.</p>
            <div class="input-group">
                <i class="fa-solid fa-key"></i>
                <input type="password" id="inp-pw" class="input-field" placeholder="보안 암호 입력..." autocomplete="off">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="App.checkPassword()">
                시스템 연결 <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- =========================================================
         [SCREEN 2] LOGIN / SIGNUP
         ========================================================= -->
    <div id="screen-login" class="screen">
        <div class="glass auth-box">
            <i class="fa-solid fa-user-astronaut auth-logo" style="color: var(--secondary);"></i>
            <h1 class="auth-title">ID Registration</h1>
            <p class="auth-desc">사용하실 닉네임을 입력하세요.<br><small>(기존 유저는 데이터가 자동 로드됩니다)</small></p>
            <div class="input-group">
                <i class="fa-solid fa-at"></i>
                <input type="text" id="inp-name" class="input-field" placeholder="닉네임 입력..." autocomplete="off" maxlength="12">
            </div>
            <button class="btn btn-primary" style="width: 100%; background: linear-gradient(135deg, var(--secondary), #be185d);" onclick="App.login()">
                서버 입장 <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </div>
    </div>

    <!-- =========================================================
         [SCREEN 3] MAIN APPLICATION DASHBOARD
         ========================================================= -->
    <div class="mobile-overlay" id="mobile-overlay" onclick="App.UI.closePanels()"></div>
    
    <div id="screen-main" class="screen">
        <!-- Mobile Header -->
        <div class="mobile-header">
            <button class="btn-icon" onclick="App.UI.toggleLeft()"><i class="fa-solid fa-users"></i></button>
            <h2 style="font-size: 1.2rem; font-weight: 800; margin: 0;"><i class="fa-solid fa-gamepad" style="color:var(--primary)"></i> AndPlayZone</h2>
            <button class="btn-icon" onclick="App.UI.toggleRight()"><i class="fa-solid fa-bars"></i></button>
        </div>

        <!-- LEFT PANEL: User List -->
        <div class="glass layout-panel panel-left" id="panel-left">
            <h2 class="section-title"><i class="fa-solid fa-network-wired" style="color:var(--success)"></i> 시스템 참여자</h2>
            <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom: 10px;">🟢 접속 중</div>
            <ul class="user-list" id="list-online"></ul>
            <div style="font-size:0.8rem; color:var(--text-muted); margin: 15px 0 10px 0;">⚫ 오프라인 (DB)</div>
            <ul class="user-list" id="list-offline"></ul>
        </div>

        <!-- CENTER PANEL: Chat & Notices -->
        <div class="glass layout-panel panel-center">
            <div class="chat-header">
                <span><i class="fa-regular fa-comments"></i> 글로벌 통신 채널</span>
                <span id="chat-status" style="font-size:0.8rem; color:var(--success);"><i class="fa-solid fa-circle"></i> 연결됨</span>
            </div>
            
            <div class="chat-messages" id="chat-box">
                <!-- Chat & Notices will be appended here -->
            </div>

            <!-- Emoticon Picker Container -->
            <div class="emoticon-picker" id="emo-picker">
                <!-- Dynamically loaded -->
            </div>

            <div class="chat-input-area">
                <button class="btn-icon" onclick="App.Chat.toggleEmoPicker()"><i class="fa-regular fa-face-smile"></i></button>
                <input type="text" id="inp-chat" placeholder="메시지를 입력하세요... (명령어: /help)" autocomplete="off">
                <button class="btn-icon" style="background: var(--primary);" onclick="App.Chat.sendText()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- RIGHT PANEL: Profile & Dev Tools -->
        <div class="glass layout-panel panel-right" id="panel-right">
            <!-- Profile Section -->
            <div class="profile-card">
                <!-- Avatar Upload -->
                <label for="upload-avatar">
                    <div class="avatar-lg" id="my-avatar">
                        <span id="my-avatar-txt">U</span>
                        <div class="overlay"><i class="fa-solid fa-camera"></i></div>
                    </div>
                </label>
                <input type="file" id="upload-avatar" accept="image/*" onchange="App.Profile.uploadAvatar(event)">
                
                <h2 class="profile-name" id="my-name">User</h2>
                <div class="profile-role" id="my-role">일반 권한</div>
                
                <div class="score-display">
                    <div style="font-size:0.9rem; color:var(--text-muted); margin-bottom:5px;">보유 시스템 크레딧</div>
                    <div class="score-value" id="my-score">0</div>
                </div>
                
                <button class="btn btn-outline" style="width:100%; margin-top:1.5rem; padding: 0.8rem;" onclick="App.logout()">
                    <i class="fa-solid fa-power-off"></i> 시스템 로그아웃
                </button>
            </div>

            <!-- Developer Tools (Hidden by default) -->
            <div class="dev-panel" id="dev-panel">
                <h2 class="section-title" style="color:var(--dev-color); border-color:rgba(245,158,11,0.3); font-size:1rem;">
                    <i class="fa-solid fa-terminal"></i> 최고관리자 터미널
                </h2>
                <!-- 16 Developer Features -->
                <div class="dev-grid">
                    <button class="dev-btn" onclick="App.Modal.open('giveScore')"><i class="fa-solid fa-hand-holding-dollar"></i> 점수 지급</button>
                    <button class="dev-btn" onclick="App.Modal.open('takeScore')"><i class="fa-solid fa-money-bill-transfer"></i> 점수 차감</button>
                    <button class="dev-btn" onclick="App.Modal.open('promoteDev')"><i class="fa-solid fa-arrow-up-right-dots"></i> 관리자 승격</button>
                    <button class="dev-btn" onclick="App.Modal.open('demoteDev')"><i class="fa-solid fa-arrow-down-wide-short"></i> 권한 박탈</button>
                    <button class="dev-btn" onclick="App.Modal.open('eventNotice')"><i class="fa-solid fa-calendar-check"></i> 이벤트 개최</button>
                    <button class="dev-btn" onclick="App.Modal.open('sysNotice')"><i class="fa-solid fa-bullhorn"></i> 시스템 공지</button>
                    <button class="dev-btn" onclick="App.Modal.open('kickUser')"><i class="fa-solid fa-user-slash"></i> 유저 추방</button>
                    <button class="dev-btn" onclick="App.Dev.resetAllScores()"><i class="fa-solid fa-clock-rotate-left"></i> 점수 초기화</button>
                    
                    <!-- Emoticon Upload/Delete -->
                    <label for="upload-emo" class="dev-btn" style="margin:0;"><i class="fa-solid fa-icons"></i> 이모티콘 추가</label>
                    <input type="file" id="upload-emo" accept="image/*" onchange="App.Dev.uploadEmoticon(event)">
                    <button class="dev-btn" onclick="App.Dev.clearEmoticons()"><i class="fa-solid fa-trash-can"></i> 이모티콘 리셋</button>
                    
                    <button class="dev-btn" onclick="App.Dev.freezeChat()"><i class="fa-solid fa-snowflake"></i> 채팅 동결</button>
                    <button class="dev-btn" onclick="App.Modal.open('changePw')"><i class="fa-solid fa-lock"></i> 암호 변경</button>
                    <button class="dev-btn" onclick="App.Dev.sysAlert()"><i class="fa-solid fa-triangle-exclamation"></i> 강제 경고음</button>
                    <button class="dev-btn" onclick="App.Dev.maintenance()"><i class="fa-solid fa-hammer"></i> 점검 모드</button>
                    <button class="dev-btn" onclick="App.Dev.backupDB()"><i class="fa-solid fa-download"></i> DB 백업</button>
                    
                    <label for="upload-db" class="dev-btn" style="margin:0;"><i class="fa-solid fa-upload"></i> DB 복원</label>
                    <input type="file" id="upload-db" accept=".json" onchange="App.Dev.restoreDB(event)">
                </div>
            </div>
        </div>
    </div>

    <!-- =========================================================
         [10] GLOBAL MODAL & TOAST CONTAINERS
         ========================================================= -->
    <div id="toast-box"></div>

    <div class="modal-overlay" id="global-modal">
        <div class="glass modal-content">
            <div class="modal-header" id="modal-title"><i class="fa-solid fa-gear"></i> 시스템 설정</div>
            <div id="modal-body">
                <!-- Dynamically Injected -->
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="App.Modal.close()">취소</button>
                <button class="btn-confirm" id="modal-confirm">실행</button>
            </div>
        </div>
    </div>

    <!-- =========================================================
         [11] JAVASCRIPT CORE APPLICATION LOGIC
         ========================================================= -->
    <script>
        /**
         * [유틸리티] 이미지 리사이징 (Base64 용량 초과 방지)
         * - GitHub Pages는 localStorage(약 5MB)에 의존하므로 이미지 최적화 필수
         */
        const ImageUtils = {
            compress: (file, maxWidth, maxHeight, quality, callback) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } } 
                        else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        callback(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        /**
         * [로컬 데이터베이스] localStorage 래퍼 클래스
         */
        class LocalDB {
            constructor() {
                this.dbName = 'AndPlayZone_Ultimate_DB';
                this.init();
            }
            init() {
                if (!localStorage.getItem(this.dbName)) {
                    this.save({
                        password: 'robuxlike', // 기본 암호
                        users: [], // {name, role, score, avatar, lastLogin}
                        chats: [], // {sender, type, content, time} - type: 'text'|'emoticon'|'sys'
                        emoticons: [], // {id, url}
                        chatFrozen: false
                    });
                }
            }
            get() { return JSON.parse(localStorage.getItem(this.dbName)); }
            save(data) { 
                try { localStorage.setItem(this.dbName, JSON.stringify(data)); } 
                catch(e) { App.UI.toast("용량 초과! 오래된 데이터를 지우거나 백업하세요.", "error"); }
            }
        }

        const db = new LocalDB();

        /**
         * [핵심 어플리케이션 시스템]
         */
        const App = {
            user: null, // 현재 로그인한 유저 객체 래퍼런스 (이름 기반)

            // 1. 보안 인가 (비밀번호)
            checkPassword: () => {
                const input = document.getElementById('inp-pw').value;
                if (input === db.get().password) {
                    App.UI.toast("보안 암호 확인 완료. 서버 접속 허가.", "success");
                    document.getElementById('screen-pw').classList.remove('active');
                    document.getElementById('screen-login').classList.add('active');
                } else {
                    App.UI.toast("시스템 암호가 일치하지 않습니다.", "error");
                }
            },

            // 2. 로그인 로직 (이스터에그 포함)
            login: () => {
                let name = document.getElementById('inp-name').value.trim();
                if (!name) return App.UI.toast("닉네임을 입력하십시오.", "error");

                let data = db.get();
                
                // 개발자 이스터에그 트리거
                if (name === 'endvipiscreat') {
                    name = '앤드맨 개발자';
                    if (!data.users.find(u => u.name === name)) {
                        data.users.push({ name: name, role: 'dev', score: 999999, avatar: '', lastLogin: Date.now() });
                        App.UI.toast("🛠️ [최고관리자] 백도어 접근 성공.", "info");
                    }
                }

                let userData = data.users.find(u => u.name === name);
                if (userData) {
                    userData.lastLogin = Date.now();
                    App.UI.toast(`환영합니다, ${name}님! 데이터 로드 완료.`);
                } else {
                    userData = { name: name, role: 'user', score: 0, avatar: '', lastLogin: Date.now() };
                    data.users.push(userData);
                    App.UI.toast(`신규 ID 생성 완료. 환영합니다!`);
                    // 신규 유저 접속 알림
                    data.chats.push({ sender: 'SYSTEM', type: 'sys', content: `[+] ${name}님이 시스템에 합류했습니다.`, time: App.Utils.time() });
                }

                db.save(data);
                App.user = userData; // 세션 바인딩
                
                document.getElementById('screen-login').classList.remove('active');
                document.getElementById('screen-main').classList.add('active');
                
                App.initDashboard();
            },

            logout: () => {
                App.user = null;
                document.getElementById('inp-name').value = '';
                document.getElementById('screen-main').classList.remove('active');
                document.getElementById('screen-login').classList.add('active');
                App.UI.toast("안전하게 로그아웃 되었습니다.");
            },

            // 3. 대시보드 초기화 (렌더링)
            initDashboard: () => {
                App.UI.renderProfile();
                App.UI.renderUsers();
                App.Chat.renderAll();
                App.Chat.renderEmoPicker();
            },

            // =========================================================
            // [UI 랜더링 및 제어 모듈]
            // =========================================================
            UI: {
                toast: (msg, type = "success") => {
                    const box = document.getElementById('toast-box');
                    const t = document.createElement('div');
                    t.className = `toast ${type}`;
                    let icon = type==='success'?'check-circle':type==='error'?'triangle-exclamation':'circle-info';
                    t.innerHTML = `<i class="fa-solid fa-${icon}"></i> <span>${msg}</span>`;
                    box.appendChild(t);
                    setTimeout(() => { t.style.animation = 'fadeOutToast 0.4s forwards'; setTimeout(()=>t.remove(),400); }, 3000);
                },

                renderProfile: () => {
                    const u = App.user;
                    document.getElementById('my-name').innerText = u.name;
                    document.getElementById('my-role').innerText = u.role === 'dev' ? '👑 최고 관리자' : '일반 참여자';
                    document.getElementById('my-role').style.color = u.role === 'dev' ? 'var(--dev-color)' : 'var(--text-muted)';
                    document.getElementById('my-score').innerText = u.score.toLocaleString();
                    
                    const avatarBox = document.getElementById('my-avatar');
                    const avatarTxt = document.getElementById('my-avatar-txt');
                    if (u.avatar) {
                        avatarBox.innerHTML = `<img src="${u.avatar}" alt="profile"><div class="overlay"><i class="fa-solid fa-camera"></i></div>`;
                    } else {
                        avatarBox.innerHTML = `<span id="my-avatar-txt">${u.name.charAt(0)}</span><div class="overlay"><i class="fa-solid fa-camera"></i></div>`;
                    }

                    const devPanel = document.getElementById('dev-panel');
                    if (u.role === 'dev') devPanel.classList.add('active');
                    else devPanel.classList.remove('active');
                },

                renderUsers: () => {
                    const data = db.get();
                    const onList = document.getElementById('list-online');
                    const offList = document.getElementById('list-offline');
                    onList.innerHTML = ''; offList.innerHTML = '';

                    // 정렬: 내가 1순위, 개발자 2순위, 점수 3순위
                    const sorted = data.users.sort((a, b) => b.score - a.score);

                    sorted.forEach(u => {
                        const isMe = u.name === App.user.name;
                        const isDev = u.role === 'dev';
                        const avatarHTML = u.avatar ? `<img src="${u.avatar}" class="avatar-sm">` : `<div class="avatar-sm">${u.name.charAt(0)}</div>`;
                        
                        const li = document.createElement('li');
                        li.className = 'user-item';
                        li.innerHTML = `
                            ${avatarHTML}
                            <div class="user-info">
                                <div class="user-name-txt">${u.name} ${isDev ? '<i class="fa-solid fa-crown" style="color:var(--dev-color);font-size:0.8rem"></i>' : ''}</div>
                                <div class="user-score-txt">${u.score.toLocaleString()} pts</div>
                            </div>
                            <div class="status-dot ${isMe ? 'online' : 'offline'}"></div>
                        `;
                        if (isMe) onList.appendChild(li);
                        else offList.appendChild(li);
                    });
                },

                // 모바일 패널 제어
                toggleLeft: () => { document.getElementById('panel-left').classList.add('open'); document.getElementById('mobile-overlay').classList.add('active'); },
                toggleRight: () => { document.getElementById('panel-right').classList.add('open'); document.getElementById('mobile-overlay').classList.add('active'); },
                closePanels: () => { document.getElementById('panel-left').classList.remove('open'); document.getElementById('panel-right').classList.remove('open'); document.getElementById('mobile-overlay').classList.remove('active'); }
            },

            // =========================================================
            // [채팅 시스템 (이모티콘 포함)]
            // =========================================================
            Chat: {
                renderAll: () => {
                    const data = db.get();
                    const box = document.getElementById('chat-box');
                    box.innerHTML = '';
                    data.chats.forEach(msg => App.Chat.appendMsg(msg));
                    box.scrollTop = box.scrollHeight;
                },
                appendMsg: (msg) => {
                    const box = document.getElementById('chat-box');
                    if (msg.type === 'sys') {
                        box.innerHTML += `<div class="msg-sys">${msg.content}</div>`;
                    } else {
                        const isMe = msg.sender === App.user.name;
                        // 보낸 사람의 아바타 찾기 (DB 비용 절감을 위해 실시간 매칭)
                        const senderData = db.get().users.find(u => u.name === msg.sender) || {};
                        const avatarSrc = senderData.avatar ? `<img src="${senderData.avatar}" class="avatar-sm" style="width:28px;height:28px;">` : `<div class="avatar-sm" style="width:28px;height:28px;font-size:0.7rem;">${msg.sender.charAt(0)}</div>`;
                        
                        let contentHTML = msg.type === 'text' ? msg.content : `<img src="${msg.content}" class="msg-emoticon">`;
                        
                        box.innerHTML += `
                            <div class="chat-msg ${isMe ? 'me' : ''}">
                                ${!isMe ? avatarSrc : ''}
                                <div class="msg-content">
                                    ${!isMe ? `<div class="msg-sender">${msg.sender} <span style="font-size:0.7rem;opacity:0.5">${msg.time}</span></div>` : `<div class="msg-sender"><span style="font-size:0.7rem;opacity:0.5">${msg.time}</span></div>`}
                                    <div class="msg-bubble">${contentHTML}</div>
                                </div>
                            </div>
                        `;
                    }
                    box.scrollTop = box.scrollHeight;
                },
                sendText: () => {
                    if (db.get().chatFrozen && App.user.role !== 'dev') return App.UI.toast("채팅이 얼어있습니다.", "error");
                    const inp = document.getElementById('inp-chat');
                    const text = inp.value.trim();
                    if (!text) return;
                    
                    const newMsg = { sender: App.user.name, type: 'text', content: text, time: App.Utils.time() };
                    let data = db.get();
                    data.chats.push(newMsg);
                    if(data.chats.length > 100) data.chats.shift(); // 100개 제한
                    db.save(data);
                    
                    App.Chat.appendMsg(newMsg);
                    inp.value = '';
                },
                sendEmoticon: (dataUrl) => {
                    if (db.get().chatFrozen && App.user.role !== 'dev') return App.UI.toast("채팅이 얼어있습니다.", "error");
                    const newMsg = { sender: App.user.name, type: 'emoticon', content: dataUrl, time: App.Utils.time() };
                    let data = db.get();
                    data.chats.push(newMsg);
                    db.save(data);
                    App.Chat.appendMsg(newMsg);
                    document.getElementById('emo-picker').classList.remove('active');
                },
                toggleEmoPicker: () => {
                    document.getElementById('emo-picker').classList.toggle('active');
                },
                renderEmoPicker: () => {
                    const picker = document.getElementById('emo-picker');
                    const emos = db.get().emoticons;
                    if (emos.length === 0) {
                        picker.innerHTML = `<div class="emo-empty">등록된 이모티콘이 없습니다.<br><small>(개발자 전용 기능)</small></div>`;
                        return;
                    }
                    picker.innerHTML = '';
                    emos.forEach(e => {
                        const div = document.createElement('div');
                        div.className = 'emo-item';
                        div.style.backgroundImage = `url(${e.url})`;
                        div.onclick = () => App.Chat.sendEmoticon(e.url);
                        picker.appendChild(div);
                    });
                }
            },

            // =========================================================
            // [프로필 기능]
            // =========================================================
            Profile: {
                uploadAvatar: (e) => {
                    const file = e.target.files[0];
                    if(!file) return;
                    // 아바타는 아주 작게 리사이징 (150x150, quality 0.8)
                    ImageUtils.compress(file, 150, 150, 0.8, (base64) => {
                        let data = db.get();
                        let me = data.users.find(u => u.name === App.user.name);
                        me.avatar = base64;
                        db.save(data);
                        App.user.avatar = base64; // 세션 업데이트
                        App.UI.renderProfile();
                        App.UI.renderUsers();
                        App.UI.toast("프로필 사진이 업데이트 되었습니다.");
                    });
                }
            },

            // =========================================================
            // [최고관리자 툴 (15종+)]
            // =========================================================
            Dev: {
                // 1 & 2. 점수 증감
                modifyScore: (targetName, amount, isAdd) => {
                    let data = db.get();
                    let target = data.users.find(u => u.name === targetName);
                    if(!target) return;
                    target.score += (isAdd ? amount : -amount);
                    db.save(data);
                    if(target.name === App.user.name) App.user.score = target.score;
                    
                    const action = isAdd ? '지급' : '차감';
                    data.chats.push({ sender: 'SYSTEM', type: 'sys', content: `[관리자] ${targetName}님의 점수가 ${amount}점 ${action}되었습니다.` });
                    db.save(data);
                    
                    App.initDashboard();
                    App.Modal.close();
                    App.UI.toast(`성공적으로 ${action} 처리 완료.`);
                },
                
                // 3 & 4. 권한 부여/박탈
                changeRole: (targetName, role) => {
                    let data = db.get();
                    let target = data.users.find(u => u.name === targetName);
                    if(!target) return;
                    target.role = role;
                    db.save(data);
                    App.initDashboard();
                    App.Modal.close();
                    App.UI.toast(`${targetName}님의 권한이 [${role}]로 변경되었습니다.`);
                },

                // 5 & 6. 시스템 공지 및 이벤트
                broadcastNotice: (title, desc, isEvent) => {
                    let data = db.get();
                    const icon = isEvent ? '🎉 [이벤트]' : '📢 [공지]';
                    data.chats.push({ sender: 'SYSTEM', type: 'sys', content: `${icon} <b>${title}</b><br>${desc}` });
                    db.save(data);
                    App.Chat.renderAll();
                    App.Modal.close();
                    App.UI.toast("서버 전체에 방송되었습니다.");
                },

                // 7. 유저 추방
                kickUser: (targetName) => {
                    let data = db.get();
                    data.users = data.users.filter(u => u.name !== targetName);
                    data.chats.push({ sender: 'SYSTEM', type: 'sys', content: `🚫 ${targetName}님이 서버에서 영구 추방되었습니다.` });
                    db.save(data);
                    App.initDashboard();
                    App.Modal.close();
                    App.UI.toast("추방 완료.");
                },

                // 8. 점수 초기화
                resetAllScores: () => {
                    if(!confirm("경고! 서버 내 모든 유저의 점수를 0으로 만듭니다. 진행할까요?")) return;
                    let data = db.get();
                    data.users.forEach(u => u.score = 0);
                    db.save(data);
                    App.user.score = 0;
                    App.initDashboard();
                    App.UI.toast("글로벌 점수 리셋 완료.", "info");
                },

                // 9. 이모티콘 업로드
                uploadEmoticon: (e) => {
                    const file = e.target.files[0];
                    if(!file) return;
                    // 이모티콘 리사이징 (200x200)
                    ImageUtils.compress(file, 200, 200, 0.9, (base64) => {
                        let data = db.get();
                        data.emoticons.push({ id: Date.now(), url: base64 });
                        db.save(data);
                        App.Chat.renderEmoPicker();
                        App.UI.toast("서버에 글로벌 이모티콘 등록 완료.");
                    });
                },

                // 10. 이모티콘 리셋
                clearEmoticons: () => {
                    if(!confirm("모든 글로벌 이모티콘을 삭제할까요? (서버 용량 확보용)")) return;
                    let data = db.get();
                    data.emoticons = [];
                    db.save(data);
                    App.Chat.renderEmoPicker();
                    App.UI.toast("이모티콘 데이터베이스가 초기화되었습니다.");
                },

                // 11. 채팅 동결
                freezeChat: () => {
                    let data = db.get();
                    data.chatFrozen = !data.chatFrozen;
                    db.save(data);
                    const status = document.getElementById('chat-status');
                    if(data.chatFrozen) {
                        status.innerHTML = `<i class="fa-solid fa-snowflake"></i> 동결됨`;
                        status.style.color = 'var(--info)';
                        App.UI.toast("서버 채팅이 동결되었습니다. (일반 유저 입력 금지)", "info");
                    } else {
                        status.innerHTML = `<i class="fa-solid fa-circle"></i> 연결됨`;
                        status.style.color = 'var(--success)';
                        App.UI.toast("채팅 동결이 해제되었습니다.");
                    }
                },

                // 12. 암호 변경
                changePw: (newPw) => {
                    let data = db.get();
                    data.password = newPw;
                    db.save(data);
                    App.Modal.close();
                    App.UI.toast(`시스템 접속 암호가 '${newPw}'(으)로 변경됨.`, "info");
                },

                // 13. 강제 경고음
                sysAlert: () => {
                    let data = db.get();
                    data.chats.push({ sender: 'SYSTEM', type: 'sys', content: `🚨 [긴급 경보] 시스템 관리자가 서버 경보를 울렸습니다! 🚨` });
                    db.save(data);
                    App.Chat.renderAll();
                },

                // 14. 점검 모드
                maintenance: () => {
                    if(!confirm("서버 점검 모드를 활성화하면 현재 브라우저가 강제 종료됩니다. 진행할까요?")) return;
                    alert("🚧 시스템 점검을 위해 연결을 차단합니다.");
                    App.logout();
                },

                // 15. DB 백업 (파일 다운로드)
                backupDB: () => {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db.get()));
                    const a = document.createElement('a');
                    a.setAttribute("href", dataStr);
                    a.setAttribute("download", `AndPlayZone_Backup_${Date.now()}.json`);
                    a.click();
                    App.UI.toast("데이터베이스가 다운로드 폴더에 저장되었습니다.");
                },

                // 16. DB 복원 (파일 업로드)
                restoreDB: (e) => {
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if(parsed.users && parsed.chats) {
                                db.save(parsed);
                                alert("DB 복원 성공. 시스템을 리부트합니다.");
                                location.reload();
                            } else {
                                App.UI.toast("유효하지 않은 백업 파일입니다.", "error");
                            }
                        } catch(err) {
                            App.UI.toast("파일 읽기 실패", "error");
                        }
                    };
                    reader.readAsText(file);
                }
            },

            // =========================================================
            // [모달 (동적 폼 제어)]
            // =========================================================
            Modal: {
                open: (type) => {
                    const overlay = document.getElementById('global-modal');
                    const title = document.getElementById('modal-title');
                    const body = document.getElementById('modal-body');
                    const btn = document.getElementById('modal-confirm');
                    
                    const genSelect = (excludeMe = false) => {
                        let html = `<select id="m-target" class="form-control"><option value="">대상을 선택하세요</option>`;
                        db.get().users.forEach(u => {
                            if(excludeMe && u.name === App.user.name) return;
                            html += `<option value="${u.name}">${u.name} (현재 ${u.score}점)</option>`;
                        });
                        return html + `</select>`;
                    };

                    switch(type) {
                        case 'giveScore':
                            title.innerHTML = '<i class="fa-solid fa-hand-holding-dollar"></i> 점수 지급';
                            body.innerHTML = genSelect() + `<input type="number" id="m-amount" class="form-control" placeholder="지급할 수량 입력">`;
                            btn.onclick = () => App.Dev.modifyScore(document.getElementById('m-target').value, parseInt(document.getElementById('m-amount').value||0), true);
                            break;
                        case 'takeScore':
                            title.innerHTML = '<i class="fa-solid fa-money-bill-transfer"></i> 점수 차감';
                            body.innerHTML = genSelect() + `<input type="number" id="m-amount" class="form-control" placeholder="차감할 수량 입력">`;
                            btn.onclick = () => App.Dev.modifyScore(document.getElementById('m-target').value, parseInt(document.getElementById('m-amount').value||0), false);
                            break;
                        case 'promoteDev':
                            title.innerHTML = '<i class="fa-solid fa-arrow-up-right-dots"></i> 부관리자 승격';
                            body.innerHTML = genSelect(true);
                            btn.onclick = () => App.Dev.changeRole(document.getElementById('m-target').value, 'dev');
                            break;
                        case 'demoteDev':
                            title.innerHTML = '<i class="fa-solid fa-arrow-down-wide-short"></i> 권한 박탈 (일반 유저로 강등)';
                            body.innerHTML = genSelect(true);
                            btn.onclick = () => App.Dev.changeRole(document.getElementById('m-target').value, 'user');
                            break;
                        case 'eventNotice':
                            title.innerHTML = '<i class="fa-solid fa-calendar-check"></i> 서버 이벤트 등록';
                            body.innerHTML = `<input type="text" id="m-title" class="form-control" placeholder="이벤트 명"><textarea id="m-desc" class="form-control" placeholder="상세 내용"></textarea>`;
                            btn.onclick = () => App.Dev.broadcastNotice(document.getElementById('m-title').value, document.getElementById('m-desc').value, true);
                            break;
                        case 'sysNotice':
                            title.innerHTML = '<i class="fa-solid fa-bullhorn"></i> 글로벌 시스템 공지';
                            body.innerHTML = `<input type="text" id="m-title" class="form-control" placeholder="공지 제목"><textarea id="m-desc" class="form-control" placeholder="내용 입력"></textarea>`;
                            btn.onclick = () => App.Dev.broadcastNotice(document.getElementById('m-title').value, document.getElementById('m-desc').value, false);
                            break;
                        case 'kickUser':
                            title.innerHTML = '<i class="fa-solid fa-user-slash"></i> 유저 영구 추방';
                            body.innerHTML = genSelect(true);
                            btn.onclick = () => App.Dev.kickUser(document.getElementById('m-target').value);
                            break;
                        case 'changePw':
                            title.innerHTML = '<i class="fa-solid fa-lock"></i> 접속 암호 변경';
                            body.innerHTML = `<input type="text" id="m-pw" class="form-control" placeholder="새로운 시스템 암호">`;
                            btn.onclick = () => App.Dev.changePw(document.getElementById('m-pw').value);
                            break;
                    }
                    overlay.classList.add('active');
                },
                close: () => document.getElementById('global-modal').classList.remove('active')
            },

            // 유틸리티
            Utils: {
                time: () => {
                    const d = new Date();
                    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                }
            }
        };

        // 엔터키 이벤트 바인딩
        document.getElementById('inp-pw').addEventListener('keypress', e => e.key === 'Enter' && App.checkPassword());
        document.getElementById('inp-name').addEventListener('keypress', e => e.key === 'Enter' && App.login());
        document.getElementById('inp-chat').addEventListener('keypress', e => e.key === 'Enter' && App.Chat.sendText());
        
        // 채팅창 외 클릭 시 이모티콘 창 닫기
        document.getElementById('chat-box').addEventListener('click', () => document.getElementById('emo-picker').classList.remove('active'));

    </script>
</body>
</html>
